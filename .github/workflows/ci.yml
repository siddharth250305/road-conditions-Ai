name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks: lint, format, and every test that needs only numpy, scikit-learn and FastAPI.
  # Tests that need torch or ultralytics skip themselves when those are not installed.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,classical,serve]"
      - name: Ruff (lint)
        run: ruff check src tests scripts api
      - name: Ruff (format)
        run: ruff format --check src tests scripts api
      - name: Pytest
        run: pytest -q

  # The ML tests: classifiers, Grad-CAM, ONNX export and parity with ONNX Runtime (CPU torch).
  python-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch first, so pip does not pull the CUDA build
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e ".[dev,export,serve]"
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # The image builds and the service starts. No model is baked in, so /health answers 503 and
  # the page still loads: that is the expected state of a fresh checkout.
  docker:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t roadcond:ci .
      - name: Smoke test
        run: |
          docker run -d --name roadcond -p 7860:7860 roadcond:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/openapi.json >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/health)" = 503
          docker logs roadcond
