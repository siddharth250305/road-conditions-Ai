project:
  name: road-condition-ai
  seeds: [0, 1, 2]              # PRD: >=3 seeds, report mean and spread

paths:
  raw: data/raw
  processed: data/processed     # feature caches (gitignored)
  splits: data/splits           # saved file lists (committed)
  artifacts: artifacts          # checkpoints, onnx, results json (gitignored)

rscd:
  task: classification
  label: friction               # material / unevenness are optional extensions
  root: data/raw/rscd           # override with --root on Colab/Kaggle
  # Folder names under root. Assumed from the RSCD download; verify on the real data.
  split_dirs: {train: train, val: vali_20k, test: test_50k}
  label_source: auto            # auto | folder | filename, see roadcond.data.rscd.label_from_path
  image_size: [240, 360]        # PRD "240 x 360 px"; verify H x W on real files
  # Ordered dry -> ice (roughly ordinal); index order is the label id.
  classes: [dry, wet, water, fresh_snow, melted_snow, ice]
  subset:
    train_size: 40000           # balanced over the 6 classes; official val/test untouched
    seed: 0                     # one fixed subset; model seeds (project.seeds) vary
  dedup:
    hash_size: 8                # dHash with 8 x 8 = 64 bits
    max_hamming: 4              # train image dropped if within 4 bits of a val/test image
    drive_id_regex: null        # e.g. '^(\d{8})' if file names carry a drive or date id

rdd2022:
  task: detection
  # Names from the PRD; D-codes from the RDD2022 dataset convention (verify on annotations).
  classes:
    - {id: 0, code: D00, name: longitudinal_crack}
    - {id: 1, code: D10, name: transverse_crack}
    - {id: 2, code: D20, name: alligator_crack}
    - {id: 3, code: D40, name: pothole}
  source_country: Japan
  target_countries: [Norway, Czech, United_States]   # keys of `countries` below
  root: data/raw/rdd2022        # override with --root on Colab/Kaggle
  # Country key -> folder under root, and where its labelled images live. Assumed from the
  # RDD2022 release; verify on the real download (test labels are not public, so only the
  # train folders are used and every split is our own held-out split).
  countries: {Japan: Japan, Norway: Norway, Czech: Czech, United_States: United_States}
  images_dir: train/images
  annotations_dir: train/annotations/xmls
  work_dir: data/processed/rdd_yolo   # symlinked images + YOLO labels + Ultralytics lists
  split:                        # per country, seeded; val is capped, the excess goes to the pool
    seed: 0
    train_pool: 0.7             # few-shot samples and the unlabelled pool come from here
    val: 0.1
    test: 0.2                   # touched once per final model
    max_val_images: 500
  dedup: {hash_size: 8, max_hamming: 4}   # pool images near-duplicating val/test are dropped
  label_budgets: [0, 10, 50, 200]
  yolo:                         # D1: source detector, trained on the source country only
    model: yolov8n              # yolov8n or yolov8s
    imgsz: 640
    epochs: 30
    batch: 16
    workers: 2
    max_train_images: 5000      # cap on the source pool so one run fits a free Colab session
    seed: 0
  augment:                      # D2: weather augmentation for the source detector
    strength: 1.0
  few_shot:                     # D3, D5: fine-tune the source detector on a few target labels
    seeds: [0, 1, 2]
    epochs: 30
    min_iterations: 100         # tiny budgets get more epochs so every budget sees >= this many steps
    batch: 8
    lr0: 0.001
    freeze: 10                  # freeze the backbone (first 10 layers of YOLOv8)
    nested: true                # each seed's 10 images are inside its 50, inside its 200
  pseudo_label:                 # D4
    confidence_threshold: 0.5   # default; the sweep below picks the final one on target val
    sweep: [0.3, 0.5, 0.7]
    pool_size: 1000             # unlabelled target images to pseudo-label
    source_replay: 2000         # source images mixed in so the detector does not forget
    epochs: 20
    batch: 16
    lr0: 0.001
    freeze: 10
    seeds: [0, 1, 2]

baseline:                       # PRD C2: colour histogram + HOG
  image_size: [120, 180]        # H x W after downscaling, keeps HOG fast
  color_bins: 16                # per channel, for RGB and HSV
  hog:
    orientations: 9
    pixels_per_cell: [16, 16]
    cells_per_block: [2, 2]
  models:                       # grid values are chosen on validation macro-F1
    logreg:
      max_iter: 1000
      grid: {C: [0.1, 1.0]}
    random_forest:
      n_estimators: 300
      grid: {max_depth: [null, 30]}

classifier:                     # PRD C3, C4: small CNN and fine-tuned pretrained models
  batch_size: 64
  num_workers: 2                # Colab has 2 CPU cores
  amp: true                     # mixed precision, only used on CUDA
  weight_decay: 0.01
  augment_strength: 1.0         # scales colour jitter (brightness 0.2, contrast 0.2, saturation 0.1)
  freeze_epochs: 1              # pretrained models: epochs with only the new head training
  ece_bins: 15
  models:                       # lr: head / whole model, backbone_lr: backbone after unfreezing
    small_cnn: {epochs: 30, patience: 6, lr: 0.001, dropout: 0.1}
    resnet50: {timm_name: resnet50, epochs: 12, patience: 4, lr: 0.001, backbone_lr: 0.0001}
    efficientnet: {timm_name: efficientnet_b0, epochs: 12, patience: 4, lr: 0.001, backbone_lr: 0.0001}

serving:                        # PRD W1-W3: ONNX bundle and the demo API
  bundle_dir: serving           # model.onnx + meta.json (+ study.json); env ROADCOND_BUNDLE_DIR overrides
  uncertainty_threshold: 0.5    # "Not sure" below this calibrated top-1 probability (PRD gives no value)
  onnx_tolerance: 1.0e-4        # ONNX Runtime must match PyTorch within this
  # The server itself reads only env vars: ROADCOND_BUNDLE_DIR, ROADCOND_UNCERTAINTY_THRESHOLD,
  # ROADCOND_MAX_UPLOAD_MB (10), ROADCOND_MAX_PIXELS (50000000), ROADCOND_HEATMAP_ALPHA (0.45),
  # ROADCOND_CORS_ORIGINS (comma-separated, default none).

metrics:
  classification: [macro_f1, accuracy, per_class_precision, per_class_recall, ece]
  detection: [map50, map50_95, f1_at_conf]
  detection_f1_conf: 0.25       # PRD: "fixed confidence threshold", value unspecified; our choice

tracking:
  backend: tensorboard          # or wandb (undecided in PRD)
